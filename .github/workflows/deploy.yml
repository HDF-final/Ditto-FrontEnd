name: Frontend CI/CD (Next.js ASG Rolling Deployment)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  LAUNCH_TEMPLATE_NAME: ${{ vars.LAUNCH_TEMPLATE_NAME }}

jobs:
  # 1. 테스트 단계 (린트, 타입 검사 및 사전 빌드 검증)
  test:
    name: Lint & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Build Test
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # 2. 배포 단계 (테스트 통과 시 실행)
  deploy:
    name: Build, Push & ASG Refresh
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. AWS 인증 (Access Key)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker 이미지 빌드 및 ECR 푸시 (x86_64 아키텍처)
      - name: Build and push Docker image
        shell: bash
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      # 4. 시작 템플릿 새 버전 생성 (UserData 주입)
      - name: Create new Launch Template version
        id: create-lt
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        shell: bash
        run: |
          ENV_B64=$(echo -n "$ENV_CONTENT" | base64 -w 0)

          cat << EOF > /tmp/user_data.sh
          #!/bin/bash
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt update -y
          apt install -y docker.io docker-compose-v2 curl unzip jq

          cd /tmp
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install
          rm -rf awscliv2.zip aws/

          systemctl enable --now docker
          usermod -aG docker ubuntu

          APP_DIR="/opt/ditto-frontend"
          mkdir -p "\$APP_DIR"
          chown -R ubuntu:ubuntu "\$APP_DIR"

          AWS_REGION="${{ vars.AWS_REGION }}"
          ECR_REGISTRY="${{ vars.ECR_REGISTRY }}"
          ECR_REPOSITORY="${{ vars.ECR_REPOSITORY }}"

          cat << COMPOSE_EOF > "\$APP_DIR/docker-compose.yml"
          services:
            frontend:
              image: "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest"
              container_name: ditto-frontend
              restart: unless-stopped
              env_file:
                - .env
              ports:
                - "3000:3000"
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
          COMPOSE_EOF

          echo "${ENV_B64}" | base64 -d > "\$APP_DIR/.env"

          /usr/local/bin/aws ecr get-login-password --region "\$AWS_REGION" | docker login --username AWS --password-stdin "\$ECR_REGISTRY"
          docker compose -f "\$APP_DIR/docker-compose.yml" pull
          docker compose -f "\$APP_DIR/docker-compose.yml" up -d
          EOF

          ENCODED_USER_DATA=$(base64 -w 0 /tmp/user_data.sh)

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "${LAUNCH_TEMPLATE_NAME}" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${ENCODED_USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT

      # 5. ASG 시작 템플릿 버전 갱신
      - name: Update ASG Launch Template version
        shell: bash
        run: |
          TARGET_ASG="${{ vars.ASG_NAME }}"
          TARGET_LT="${{ vars.LAUNCH_TEMPLATE_NAME }}"
          TARGET_VER="${{ steps.create-lt.outputs.NEW_VERSION }}"

          echo "Updating ASG [${TARGET_ASG}] with Launch Template [${TARGET_LT}] Version [${TARGET_VER}]"

          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --launch-template "LaunchTemplateName=${TARGET_LT},Version=${TARGET_VER}"

      # 6. ASG 인스턴스 새로고침(Instance Refresh) 실행 및 완료 대기
      - name: Trigger and monitor ASG Instance Refresh
        shell: bash
        run: |
          TARGET_ASG="${{ vars.ASG_NAME }}"
          echo "Checking existing Instance Refresh for ASG: ${TARGET_ASG}..."

          EXISTING_STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "None")

          if [ "$EXISTING_STATUS" = "InProgress" ] || [ "$EXISTING_STATUS" = "Pending" ]; then
            echo "Cancelling previous in-progress refresh..."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "${TARGET_ASG}" || true
            sleep 10
          fi

          echo "Starting Instance Refresh for ASG: ${TARGET_ASG}..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 0}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${TARGET_ASG}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "[$(date +'%H:%M:%S')] Current refresh status: ${STATUS}"

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh completed successfully!"
              break
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh failed or was cancelled."
              exit 1
            fi

            sleep 10
          done