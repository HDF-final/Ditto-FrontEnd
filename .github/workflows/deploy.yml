name: Frontend CI/CD (Next.js ASG Rolling Deployment)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  LAUNCH_TEMPLATE_NAME: ${{ vars.LAUNCH_TEMPLATE_NAME }}

jobs:
  # 1. 사전 빌드 및 검증 단계
  test:
    name: Lint & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Build Test
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # 2. 빌드, ECR 푸시 및 ASG 무중단 롤링 배포 단계
  deploy:
    name: Build, Push & ASG Refresh
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. AWS 인증 (Access Key)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker 이미지 빌드 및 ECR 푸시 (x86_64 아키텍처)
      - name: Build and push Docker image
        shell: bash
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      # 4. 시작 템플릿 새 버전 생성 (UserData 주입)
      - name: Create new Launch Template version
        id: create-lt
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        shell: bash
        run: |
          ENV_B64=$(echo -n "$ENV_CONTENT" | base64 -w 0)

          cat << EOF > /tmp/user_data.sh
          #!/bin/bash
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt update -y
          apt install -y docker.io curl unzip jq

          cd /tmp
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          ./aws/install
          rm -rf awscliv2.zip aws/

          systemctl enable --now docker
          usermod -aG docker ubuntu

          APP_DIR="/opt/ditto-frontend"
          mkdir -p "\$APP_DIR"
          chown -R ubuntu:ubuntu "\$APP_DIR"

          echo "${ENV_B64}" | base64 -d > "\$APP_DIR/.env"

          # ECR 로그인
          /usr/local/bin/aws ecr get-login-password --region "${{ vars.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

          # 최신 이미지 Pull
          docker pull "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest"

          # 기존 컨테이너가 있다면 중지 및 삭제
          docker stop ditto-frontend || true
          docker rm ditto-frontend || true

          # 환경변수 주입 및 3000번 포트로 컨테이너 실행
          docker run -d \
            --name ditto-frontend \
            --restart unless-stopped \
            --env-file "\$APP_DIR/.env" \
            -p 3000:3000 \
            "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest"
          EOF

          ENCODED_USER_DATA=$(base64 -w 0 /tmp/user_data.sh)

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "${LAUNCH_TEMPLATE_NAME}" \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${ENCODED_USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT

      # 5. ASG 시작 템플릿 버전 갱신
      - name: Update ASG Launch Template version
        shell: bash
        run: |
          TARGET_ASG="${{ vars.ASG_NAME }}"
          TARGET_LT="${{ vars.LAUNCH_TEMPLATE_NAME }}"
          TARGET_VER="${{ steps.create-lt.outputs.NEW_VERSION }}"

          echo "Updating ASG [${TARGET_ASG}] with Launch Template [${TARGET_LT}] Version [${TARGET_VER}]"

          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --launch-template "LaunchTemplateName=${TARGET_LT},Version=${TARGET_VER}"

      # 6. ASG 인스턴스 새로고침 실행 및 모니터링 (무중단 롤링 + 웜업 60초 + 6분 타임아웃)
      - name: Trigger and monitor ASG Instance Refresh
        shell: bash
        run: |
          TARGET_ASG="${{ vars.ASG_NAME }}"
          echo "Checking existing Instance Refresh for ASG: ${TARGET_ASG}..."

          EXISTING_STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "None")

          if [ "$EXISTING_STATUS" = "InProgress" ] || [ "$EXISTING_STATUS" = "Pending" ] || [ "$EXISTING_STATUS" = "Cancelling" ]; then
            echo "Cancelling previous in-progress refresh..."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "${TARGET_ASG}" || true
            
            echo "Waiting for previous refresh to fully terminate..."
            while true; do
              CHECK_STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "${TARGET_ASG}" \
                --query 'InstanceRefreshes[0].Status' \
                --output text 2>/dev/null || echo "None")
              
              if [ "$CHECK_STATUS" != "InProgress" ] && [ "$CHECK_STATUS" != "Pending" ] && [ "$CHECK_STATUS" != "Cancelling" ]; then
                echo "Previous refresh successfully terminated with status: ${CHECK_STATUS}"
                break
              fi
              echo "Current status: ${CHECK_STATUS} ... waiting 5s"
              sleep 5
            done
          fi

          echo "Starting Instance Refresh for ASG: ${TARGET_ASG}..."
          # MinHealthy 100%, MaxHealthy 200%, Warmup 60s 설정
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${TARGET_ASG}" \
            --preferences '{"MinHealthyPercentage": 100, "MaxHealthyPercentage": 200, "InstanceWarmup": 60}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          # 6분 타임아웃 (10초 간격 * 36회 = 360초)
          MAX_ATTEMPTS=36
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${TARGET_ASG}" \
              --instance-refresh-ids "${REFRESH_ID}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "[$(date +'%H:%M:%S')] Current refresh status: ${STATUS} (Check $((ATTEMPT+1))/${MAX_ATTEMPTS})"

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh completed successfully!"
              break
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh failed or was cancelled."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 10
          done

          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "❌ Instance Refresh timed out after 6 minutes!"
            echo "Cancelling stuck instance refresh..."
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "${TARGET_ASG}" || true
            exit 1
          fi